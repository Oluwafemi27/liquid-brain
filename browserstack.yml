# Runs the same Playwright tests on real browsers and phones in BrowserStack (student plan).
# 1. npm i -D browserstack-node-sdk   2. export BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY
# 3. deploy ADUF somewhere BrowserStack can reach (or use `browserStackLocal: true` below for localhost)
# 4. E2E_BASE_URL=https://your-app npm run test:browserstack
userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}
projectName: ADUF
buildName: aduf-smoke
framework: playwright
browserStackLocal: false   # set true to test http://localhost through BrowserStack's tunnel
platforms:
  - os: Windows
    osVersion: 11
    browserName: chrome
    browserVersion: latest
  - os: OS X
    osVersion: Sonoma
    browserName: playwright-webkit
    browserVersion: latest
  - os: Windows
    osVersion: 11
    browserName: playwright-firefox
    browserVersion: latest
  - deviceName: iPhone 15
    osVersion: 17
    browserName: playwright-webkit
    deviceOrientation: portrait
  - deviceName: Samsung Galaxy S23
    osVersion: 13.0
    browserName: chrome
    deviceOrientation: portrait
debug: false
networkLogs: false
